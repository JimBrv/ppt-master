<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- McKinsey content layout: arrow_track_columns. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="mckTrackA" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#27AE60"/><stop offset="100%" stop-color="#0076A8"/></linearGradient>
    <linearGradient id="mckTrackB" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0076A8"/><stop offset="100%" stop-color="#005587"/></linearGradient>
    <linearGradient id="mckBtn" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#33779F"/><stop offset="100%" stop-color="#005587"/></linearGradient>
    <linearGradient id="mckArrow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#005587"/><stop offset="100%" stop-color="#E74C3C"/></linearGradient>
  </defs>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005587"/>
      <stop offset="100%" stop-color="#0076A8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#headerGrad)"/>
  <rect x="0" y="5" width="1280" height="75" fill="#FAFBFC"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="22" width="6" height="40" fill="#005587"/>
  <text x="84" y="52" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">{{PAGE_TITLE}}</text>
  <rect x="0" y="640" width="1280" height="80" fill="#FAFBFC"/>
  <line x1="0" y1="640" x2="1280" y2="640" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="1140" y="655" width="80" height="30" fill="#005587" rx="4"/>
  <g transform="translate(38.96,-30.09) scale(0.9391)">
  <!-- track -->
  <rect x="132" y="216" width="340" height="49" fill="url(#mckTrackA)"/>
  <rect x="470" y="216" width="384" height="49" fill="url(#mckTrackB)"/>
  <polygon points="852,216 1130,216 1130,194 1203,240 1130,287 1130,265 852,265" fill="url(#mckArrow)"/>
  <rect x="100" y="201" width="72" height="72" rx="24" fill="#27AE60"/>
  <use data-icon="{{S1_ICON}}" x="119" y="220" width="34" height="34" fill="#FFFFFF"/>
  <text x="300" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{S1_LABEL}}</text>
  <rect x="425" y="201" width="72" height="72" rx="24" fill="#0076A8"/>
  <use data-icon="{{S2_ICON}}" x="444" y="220" width="34" height="34" fill="#FFFFFF"/>
  <text x="665" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{S2_LABEL}}</text>
  <rect x="822" y="201" width="72" height="72" rx="24" fill="#005587"/>
  <use data-icon="{{S3_ICON}}" x="841" y="220" width="34" height="34" fill="#FFFFFF"/>
  <text x="1010" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{S3_LABEL}}</text>
  <!-- column 1 -->
  <rect x="160" y="288" width="253" height="197" rx="12" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="286" y="344" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">{{C1_TITLE}}</text>
  <text x="286" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">{{C1_L1}}</text>
  <text x="286" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">{{C1_L2}}</text>
  <!-- column 2 -->
  <rect x="546" y="288" width="253" height="197" rx="12" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="672" y="344" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">{{C2_TITLE}}</text>
  <text x="672" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">{{C2_L1}}</text>
  <text x="672" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">{{C2_L2}}</text>
  <!-- column 3 -->
  <rect x="931" y="288" width="253" height="197" rx="12" fill="#FFFFFF" fill-opacity="0.7"/>
  <text x="1057" y="344" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">{{C3_TITLE}}</text>
  <text x="1057" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">{{C3_L1}}</text>
  <text x="1057" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">{{C3_L2}}</text>
  <rect x="160" y="511" width="1024" height="95" rx="14" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="215" y="533" width="184" height="50" rx="6" fill="url(#mckBtn)"/>
  <text x="307" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{POLICY_BTN}}</text>
  <text x="628" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#33779F">{{POLICY_A}}</text>
  <text x="961" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#33779F">{{POLICY_B}}</text>
  </g>
  <text x="1180" y="676" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
