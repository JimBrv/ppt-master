  <rect x="186" y="620" width="915" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#E5E7EB" stroke-width="1"/>
  <text x="643" y="656" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CONCLUSION}}</text>
  </g>
  <text x="1180" y="676" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
