  <text x="176" y="201" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">{{R1_LABEL}}</text>
  <text x="636" y="186" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#2C3E50">{{R1_L1}}</text>
  <text x="636" y="212" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#2C3E50">{{R1_L2}}</text>
  <!-- layer 2 -->
  <rect x="150" y="256" width="998" height="104" rx="8" fill="#4D88AB" fill-opacity="0.18"/>
