<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Pixel Retro content layout: layered_rows. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <text x="60" y="70" font-family="Consolas, Microsoft YaHei, monospace" font-size="36" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">{{PAGE_TITLE}}</text>
  <rect x="60" y="100" width="200" height="2" fill="#30363D"/>
  <rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <g transform="translate(10.02,-15.97) scale(0.9843)">
  <rect x="571" y="140" width="8" height="464" rx="4" fill="#30363D"/>
  <!-- layer 1 -->
  <rect x="150" y="140" width="998" height="104" rx="8" fill="#39FF14" fill-opacity="0.18"/>
  <rect x="1143" y="140" width="5" height="104" rx="2" fill="#39FF14"/>
  <circle cx="575" cy="192" r="30" fill="#39FF14"/>
  <use data-icon="{{R1_ICON}}" x="559" y="176" width="32" height="32" fill="#0D1117"/>
  <text x="176" y="201" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#E6EDF3">{{R1_LABEL}}</text>
  <text x="636" y="186" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R1_L1}}</text>
  <text x="636" y="212" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R1_L2}}</text>
  <!-- layer 2 -->
  <rect x="150" y="256" width="998" height="104" rx="8" fill="#00D4FF" fill-opacity="0.18"/>
  <rect x="1143" y="256" width="5" height="104" rx="2" fill="#00D4FF"/>
  <circle cx="575" cy="308" r="30" fill="#00D4FF"/>
  <use data-icon="{{R2_ICON}}" x="559" y="292" width="32" height="32" fill="#0D1117"/>
  <text x="176" y="317" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#E6EDF3">{{R2_LABEL}}</text>
  <text x="636" y="302" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R2_L1}}</text>
  <text x="636" y="328" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R2_L2}}</text>
  <!-- layer 3 -->
  <rect x="150" y="372" width="998" height="104" rx="8" fill="#1F6FEB" fill-opacity="0.18"/>
  <rect x="1143" y="372" width="5" height="104" rx="2" fill="#1F6FEB"/>
  <circle cx="575" cy="424" r="30" fill="#1F6FEB"/>
  <use data-icon="{{R3_ICON}}" x="559" y="408" width="32" height="32" fill="#0D1117"/>
  <text x="176" y="433" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#E6EDF3">{{R3_LABEL}}</text>
  <text x="636" y="418" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R3_L1}}</text>
  <text x="636" y="444" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R3_L2}}</text>
  <!-- layer 4 -->
  <rect x="150" y="488" width="998" height="104" rx="8" fill="#FF2E97" fill-opacity="0.18"/>
  <rect x="1143" y="488" width="5" height="104" rx="2" fill="#FF2E97"/>
  <circle cx="575" cy="540" r="30" fill="#FF2E97"/>
  <use data-icon="{{R4_ICON}}" x="559" y="524" width="32" height="32" fill="#0D1117"/>
  <text x="176" y="549" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#E6EDF3">{{R4_LABEL}}</text>
  <text x="636" y="534" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R4_L1}}</text>
  <text x="636" y="560" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#E6EDF3">{{R4_L2}}</text>
  <rect x="186" y="620" width="915" height="56" rx="10" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
  <text x="643" y="656" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#39FF14">{{CONCLUSION}}</text>
  </g>
  <text x="60" y="698" font-family="Consolas, monospace" font-size="14" fill="#8B949E">{{PAGE_NUM}}</text>
</svg>
