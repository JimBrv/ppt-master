<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Pixel Retro content layout: matrix_2x2. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <text x="60" y="70" font-family="Consolas, Microsoft YaHei, monospace" font-size="36" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">{{PAGE_TITLE}}</text>
  <rect x="60" y="100" width="200" height="2" fill="#30363D"/>
  <rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <g transform="translate(10.02,-15.97) scale(0.9843)">
  <rect x="140" y="156" width="4" height="438" rx="2" fill="#8B949E"/>
  <polygon points="130,160 142,138 154,160" fill="#8B949E"/>
  <rect x="170" y="600" width="1046" height="4" rx="2" fill="#8B949E"/>
  <polygon points="1214,590 1236,602 1214,614" fill="#8B949E"/>
  <text x="126" y="180" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#8B949E">{{Y_HIGH}}</text>
  <text x="126" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#1F6FEB">{{Y_LABEL}}</text>
  <text x="126" y="584" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#8B949E">{{Y_LOW}}</text>
  <text x="170" y="634" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#8B949E">{{X_LOW}}</text>
  <text x="693" y="634" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F6FEB">{{X_LABEL}}</text>
  <text x="1216" y="634" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#8B949E">{{X_HIGH}}</text>
  <!-- quadrant TL -->
  <rect x="170" y="150" width="525" height="210" rx="14" fill="#15242D" stroke="#30363D" stroke-width="1"/>
  <text x="198" y="206" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1FD9FF">{{TL_TITLE}}</text>
  <text x="198" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{TL_L1}}</text>
  <text x="198" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{TL_L2}}</text>
  <text x="198" y="306" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{TL_L3}}</text>
  <!-- quadrant TR -->
  <rect x="715" y="150" width="525" height="210" rx="14" fill="#00D4FF"/>
  <text x="743" y="206" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#0D1117">{{TR_TITLE}}</text>
  <text x="743" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#0D1117">{{TR_L1}}</text>
  <text x="743" y="278" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#0D1117">{{TR_L2}}</text>
  <text x="743" y="306" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#0D1117">{{TR_L3}}</text>
  <!-- quadrant BL -->
  <rect x="170" y="380" width="525" height="210" rx="14" fill="#15242D" stroke="#30363D" stroke-width="1"/>
  <text x="198" y="436" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1FD9FF">{{BL_TITLE}}</text>
  <text x="198" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{BL_L1}}</text>
  <text x="198" y="508" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{BL_L2}}</text>
  <text x="198" y="536" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{BL_L3}}</text>
  <!-- quadrant BR -->
  <rect x="715" y="380" width="525" height="210" rx="14" fill="#15242D" stroke="#30363D" stroke-width="1"/>
  <text x="743" y="436" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1FD9FF">{{BR_TITLE}}</text>
  <text x="743" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{BR_L1}}</text>
  <text x="743" y="508" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{BR_L2}}</text>
  <text x="743" y="536" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{BR_L3}}</text>
  <text x="640" y="682" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#39FF14">{{CONCLUSION}}</text>
  </g>
  <text x="60" y="698" font-family="Consolas, monospace" font-size="14" fill="#8B949E">{{PAGE_NUM}}</text>
</svg>
