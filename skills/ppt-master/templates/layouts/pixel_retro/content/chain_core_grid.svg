<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Pixel Retro content layout: chain_core_grid. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="pxCore" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1F6FEB"/><stop offset="100%" stop-color="#00D4FF"/></linearGradient>
  </defs>
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <text x="60" y="70" font-family="Consolas, Microsoft YaHei, monospace" font-size="36" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">{{PAGE_TITLE}}</text>
  <rect x="60" y="100" width="200" height="2" fill="#30363D"/>
  <rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <g transform="translate(10.02,-15.97) scale(0.9843)">
  <!-- racetrack ring behind the core band -->
  <rect x="205" y="312" width="845" height="202" rx="101" fill="none" stroke="#00D4FF" stroke-width="20" stroke-opacity="0.3"/>
  <!-- chain 1 -->
  <text x="201" y="258" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#00D4FF">{{CH1_TITLE}}</text>
  <text x="201" y="294" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="middle" fill="#E6EDF3">{{CH1_BODY}}</text>
  <!-- chain 2 -->
  <text x="419" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#00D4FF">{{CH2_TITLE}}</text>
  <text x="419" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="middle" fill="#E6EDF3">{{CH2_BODY}}</text>
  <!-- chain 3 -->
  <text x="636" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#00D4FF">{{CH3_TITLE}}</text>
  <text x="636" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="middle" fill="#E6EDF3">{{CH3_BODY}}</text>
  <!-- chain 4 -->
  <text x="854" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#00D4FF">{{CH4_TITLE}}</text>
  <text x="854" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="middle" fill="#E6EDF3">{{CH4_BODY}}</text>
  <!-- chain 5 -->
  <text x="1072" y="258" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#00D4FF">{{CH5_TITLE}}</text>
  <text x="1072" y="294" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="middle" fill="#E6EDF3">{{CH5_BODY}}</text>
  <rect x="247" y="342" width="761" height="142" rx="24" fill="#161B22"/>
  <rect x="278" y="363" width="100" height="100" rx="30" fill="url(#pxCore)"/>
  <text x="328" y="420" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0D1117">{{CORE1}}</text>
  <rect x="404" y="363" width="100" height="100" rx="30" fill="url(#pxCore)"/>
  <text x="454" y="420" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0D1117">{{CORE2}}</text>
  <rect x="751" y="363" width="100" height="100" rx="30" fill="url(#pxCore)"/>
  <text x="801" y="420" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0D1117">{{CORE3}}</text>
  <rect x="877" y="363" width="100" height="100" rx="30" fill="url(#pxCore)"/>
  <text x="927" y="420" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0D1117">{{CORE4}}</text>
  <text x="627" y="424" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#00D4FF">{{CENTER}}</text>
  <rect x="157" y="567" width="464" height="46" rx="12" fill="#161B22" stroke="#0C6E85" stroke-width="1.5"/>
  <text x="173" y="596" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#1F6FEB">{{G1_LABEL}}</text>
  <text x="605" y="596" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#E6EDF3">{{G1_VALUE}}</text>
  <rect x="663" y="567" width="464" height="46" rx="12" fill="#161B22" stroke="#0C6E85" stroke-width="1.5"/>
  <text x="679" y="596" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#1F6FEB">{{G2_LABEL}}</text>
  <text x="1111" y="596" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#E6EDF3">{{G2_VALUE}}</text>
  <rect x="157" y="625" width="464" height="46" rx="12" fill="#161B22" stroke="#0C6E85" stroke-width="1.5"/>
  <text x="173" y="654" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#1F6FEB">{{G3_LABEL}}</text>
  <text x="605" y="654" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#E6EDF3">{{G3_VALUE}}</text>
  <rect x="663" y="625" width="464" height="46" rx="12" fill="#161B22" stroke="#0C6E85" stroke-width="1.5"/>
  <text x="679" y="654" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#1F6FEB">{{G4_LABEL}}</text>
  <text x="1111" y="654" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" text-anchor="end" fill="#E6EDF3">{{G4_VALUE}}</text>
  </g>
  <text x="60" y="698" font-family="Consolas, monospace" font-size="14" fill="#8B949E">{{PAGE_NUM}}</text>
</svg>
