<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Pixel Retro content layout: spectrum_position. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <text x="60" y="70" font-family="Consolas, Microsoft YaHei, monospace" font-size="36" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">{{PAGE_TITLE}}</text>
  <rect x="60" y="100" width="200" height="2" fill="#30363D"/>
  <rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <g transform="translate(10.02,-15.97) scale(0.9843)">
  <rect x="100" y="300" width="1080" height="6" rx="3" fill="#30363D"/>
  <!-- extreme L -->
  <text x="60" y="214" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="bold" fill="#8B949E">{{L_NAME}}</text>
  <text x="60" y="246" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#8B949E">{{L_L1}}</text>
  <text x="60" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#8B949E">{{L_L2}}</text>
  <circle cx="140" cy="303" r="14" fill="#8B949E"/>
  <rect x="60" y="330" width="170" height="36" rx="18" fill="#8B949E" fill-opacity="0.15"/>
  <text x="145" y="354" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B949E">{{L_TAG}}</text>
  <!-- extreme R -->
  <text x="880" y="214" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="bold" fill="#8B949E">{{R_NAME}}</text>
  <text x="880" y="246" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#8B949E">{{R_L1}}</text>
  <text x="880" y="270" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#8B949E">{{R_L2}}</text>
  <circle cx="1140" cy="303" r="14" fill="#8B949E"/>
  <rect x="880" y="330" width="170" height="36" rx="18" fill="#8B949E" fill-opacity="0.15"/>
  <text x="965" y="354" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B949E">{{R_TAG}}</text>
  <!-- the position held -->
  <rect x="430" y="150" width="420" height="130" rx="16" fill="#00D4FF"/>
  <text x="640" y="200" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#0D1117">{{M_NAME}}</text>
  <text x="640" y="232" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" text-anchor="middle" fill="#0D1117">{{M_L1}}</text>
  <text x="640" y="256" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" text-anchor="middle" fill="#0D1117">{{M_L2}}</text>
  <polygon points="622,280 658,280 640,296" fill="#00D4FF"/>
  <circle cx="640" cy="303" r="22" fill="#00D4FF" fill-opacity="0.25"/>
  <circle cx="640" cy="303" r="13" fill="#00D4FF"/>
  <text x="40" y="414" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="bold" fill="#1F6FEB">{{PRINCIPLES_LABEL}}</text>
  <rect data-slot-box="P1_TITLE" x="40" y="430" width="384" height="180" rx="14" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
  <rect data-slot-box="P1_TITLE" x="64" y="450" width="40" height="6" rx="3" fill="#00D4FF"/>
  <text x="64" y="492" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#1FD9FF">{{P1_TITLE}}</text>
  <text x="64" y="522" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P1_L1}}</text>
  <text x="64" y="549" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P1_L2}}</text>
  <text x="64" y="576" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P1_L3}}</text>
  <rect data-slot-box="P2_TITLE" x="448" y="430" width="384" height="180" rx="14" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
  <rect data-slot-box="P2_TITLE" x="472" y="450" width="40" height="6" rx="3" fill="#00D4FF"/>
  <text x="472" y="492" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#1FD9FF">{{P2_TITLE}}</text>
  <text x="472" y="522" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P2_L1}}</text>
  <text x="472" y="549" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P2_L2}}</text>
  <text x="472" y="576" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P2_L3}}</text>
  <rect data-slot-box="P3_TITLE" x="856" y="430" width="384" height="180" rx="14" fill="#161B22" fill-opacity="0.9" stroke="#30363D" stroke-width="1"/>
  <rect data-slot-box="P3_TITLE" x="880" y="450" width="40" height="6" rx="3" fill="#00D4FF"/>
  <text x="880" y="492" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#1FD9FF">{{P3_TITLE}}</text>
  <text x="880" y="522" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P3_L1}}</text>
  <text x="880" y="549" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P3_L2}}</text>
  <text x="880" y="576" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#C9D1D9">{{P3_L3}}</text>
  <text x="640" y="660" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#39FF14">{{CONCLUSION}}</text>
  </g>
  <text x="60" y="698" font-family="Consolas, monospace" font-size="14" fill="#8B949E">{{PAGE_NUM}}</text>
</svg>
