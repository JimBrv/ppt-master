  <text x="748" y="424" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#E6EDF3">{{R2_L1}}</text>
  <text x="748" y="448" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#E6EDF3">{{R2_L2}}</text>
  <rect x="985" y="405" width="205" height="46" rx="10" fill="#39FF14" fill-opacity="0.15"/>
