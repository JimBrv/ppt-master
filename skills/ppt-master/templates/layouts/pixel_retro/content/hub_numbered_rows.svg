  <rect data-slot-box="CALLOUT3" x="262" y="246" width="110" height="52" rx="12" fill="#123945" stroke="#30363D" stroke-width="1"/>
  <text x="317" y="279" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1FD9FF">{{CALLOUT3}}</text>
  <rect data-slot-box="CALLOUT4" x="20" y="540" width="110" height="52" rx="12" fill="#123945" stroke="#30363D" stroke-width="1"/>
  <text x="75" y="573" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1FD9FF">{{CALLOUT4}}</text>
