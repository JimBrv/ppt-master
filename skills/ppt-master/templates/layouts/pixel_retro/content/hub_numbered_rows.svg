  <text x="556" y="576" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" fill="#E6EDF3">{{R3_TITLE}}</text>
  <text x="748" y="564" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#E6EDF3">{{R3_L1}}</text>
  <text x="748" y="588" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#E6EDF3">{{R3_L2}}</text>
  <rect x="985" y="545" width="205" height="46" rx="10" fill="#FFD700" fill-opacity="0.15"/>
