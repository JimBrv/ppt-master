<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- Background: cover page from original PPTX (image3.jpeg) -->
  <image href="../images/qax_bg_cover.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>

  <!-- Title placeholder -->
  <text x="103" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="54" font-weight="bold" fill="#003893">{{TITLE}}</text>
  <!-- Subtitle placeholder -->
  <text x="103" y="510" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#003893">{{SUBTITLE}}</text>
  <!-- Date/author placeholder -->
  <text x="103" y="640" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#666666">{{DATE}}</text>

  </svg>