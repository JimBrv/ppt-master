<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- Background: chapter page from original PPTX (image2.jpeg) -->
  <image href="../images/qax_bg_chapter.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <!-- Original HD Logo Overlay (image1.png) -->
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>

  <!-- Chapter title placeholder -->
  <text x="60" y="90" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="48" font-weight="bold" fill="#003893">{{CHAPTER_TITLE}}</text>
  <!-- TOC / Section content area -->
  <text x="100" y="220" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#003893">{{SECTION_1}}</text>
  <text x="100" y="290" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#003893">{{SECTION_2}}</text>
  <text x="100" y="360" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#003893">{{SECTION_3}}</text>
  <text x="100" y="430" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#003893">{{SECTION_4}}</text>

  </svg>