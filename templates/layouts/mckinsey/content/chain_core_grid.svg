<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- McKinsey content layout: chain_core_grid. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="mckCore" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0076A8"/><stop offset="100%" stop-color="#005587"/></linearGradient>
  </defs>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005587"/>
      <stop offset="100%" stop-color="#0076A8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#headerGrad)"/>
  <rect x="0" y="5" width="1280" height="75" fill="#FAFBFC"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="22" width="6" height="40" fill="#005587"/>
  <text x="84" y="52" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">{{PAGE_TITLE}}</text>
  <rect x="0" y="640" width="1280" height="80" fill="#FAFBFC"/>
  <line x1="0" y1="640" x2="1280" y2="640" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="1140" y="655" width="80" height="30" fill="#005587" rx="4"/>
  <g transform="translate(38.96,-30.09) scale(0.9391)">
  <!-- racetrack ring behind the core band -->
  <rect x="205" y="312" width="845" height="202" rx="101" fill="none" stroke="#005587" stroke-width="20" stroke-opacity="0.3"/>
  <!-- chain 1 -->
  <text x="201" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CH1_TITLE}}</text>
  <text x="201" y="294" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2C3E50">{{CH1_BODY}}</text>
  <!-- chain 2 -->
  <text x="419" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CH2_TITLE}}</text>
  <text x="419" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2C3E50">{{CH2_BODY}}</text>
  <!-- chain 3 -->
  <text x="636" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CH3_TITLE}}</text>
  <text x="636" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2C3E50">{{CH3_BODY}}</text>
  <!-- chain 4 -->
  <text x="854" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CH4_TITLE}}</text>
  <text x="854" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2C3E50">{{CH4_BODY}}</text>
  <!-- chain 5 -->
  <text x="1072" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CH5_TITLE}}</text>
  <text x="1072" y="294" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2C3E50">{{CH5_BODY}}</text>
  <rect x="247" y="342" width="761" height="142" rx="24" fill="#FFFFFF"/>
  <rect x="278" y="363" width="100" height="100" rx="30" fill="url(#mckCore)"/>
  <text x="328" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE1}}</text>
  <rect x="404" y="363" width="100" height="100" rx="30" fill="url(#mckCore)"/>
  <text x="454" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE2}}</text>
  <rect x="751" y="363" width="100" height="100" rx="30" fill="url(#mckCore)"/>
  <text x="801" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE3}}</text>
  <rect x="877" y="363" width="100" height="100" rx="30" fill="url(#mckCore)"/>
  <text x="927" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE4}}</text>
  <text x="627" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#005587">{{CENTER}}</text>
  <rect x="157" y="567" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#8CB3C9" stroke-width="1.5"/>
  <text x="173" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0076A8">{{G1_LABEL}}</text>
  <text x="605" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end" fill="#2C3E50">{{G1_VALUE}}</text>
  <rect x="663" y="567" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#8CB3C9" stroke-width="1.5"/>
  <text x="679" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0076A8">{{G2_LABEL}}</text>
  <text x="1111" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end" fill="#2C3E50">{{G2_VALUE}}</text>
  <rect x="157" y="625" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#8CB3C9" stroke-width="1.5"/>
  <text x="173" y="654" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0076A8">{{G3_LABEL}}</text>
  <text x="605" y="654" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end" fill="#2C3E50">{{G3_VALUE}}</text>
  <rect x="663" y="625" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#8CB3C9" stroke-width="1.5"/>
  <text x="679" y="654" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0076A8">{{G4_LABEL}}</text>
  <text x="1111" y="654" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end" fill="#2C3E50">{{G4_VALUE}}</text>
  </g>
  <text x="1180" y="676" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
