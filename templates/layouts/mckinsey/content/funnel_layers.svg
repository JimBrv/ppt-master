<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- McKinsey content layout: funnel_layers. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005587"/>
      <stop offset="100%" stop-color="#0076A8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#headerGrad)"/>
  <rect x="0" y="5" width="1280" height="75" fill="#FAFBFC"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="22" width="6" height="40" fill="#005587"/>
  <text x="84" y="52" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">{{PAGE_TITLE}}</text>
  <rect x="0" y="640" width="1280" height="80" fill="#FAFBFC"/>
  <line x1="0" y1="640" x2="1280" y2="640" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="1140" y="655" width="80" height="30" fill="#005587" rx="4"/>
  <g transform="translate(38.96,-30.09) scale(0.9391)">
  <!-- layer 1 band -->
  <rect x="171" y="195" width="977" height="90" rx="4" fill="#7FAAC3" fill-opacity="0.16"/>
  <rect x="1143" y="195" width="5" height="90" rx="2" fill="#7FAAC3"/>
  <!-- layer 2 band -->
  <rect x="171" y="295" width="977" height="94" rx="4" fill="#4D88AB" fill-opacity="0.16"/>
  <rect x="1143" y="295" width="5" height="94" rx="2" fill="#4D88AB"/>
  <!-- layer 3 band -->
  <rect x="171" y="399" width="977" height="87" rx="4" fill="#0076A8" fill-opacity="0.16"/>
  <rect x="1143" y="399" width="5" height="87" rx="2" fill="#0076A8"/>
  <!-- layer 4 band -->
  <rect x="171" y="497" width="977" height="79" rx="4" fill="#004D5C" fill-opacity="0.16"/>
  <rect x="1143" y="497" width="5" height="79" rx="2" fill="#004D5C"/>
  <!-- funnel, drawn bottom-up so upper layers overlap lower ones -->
  <path d="M512,473 L666,473 L645,567 Q589,587 533,567 Z" fill="#004D5C"/>
  <path d="M480,378 L698,378 L668,473 Q589,493 510,473 Z" fill="#0076A8"/>
  <path d="M437,287 L741,287 L699,379 Q589,399 479,379 Z" fill="#4D88AB"/>
  <path d="M379,194 L799,194 L740,288 Q589,308 438,288 Z" fill="#7FAAC3"/>
  <ellipse cx="589" cy="194" rx="209" ry="15" fill="#B2CCDB"/>
  <circle cx="589" cy="256" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <use data-icon="{{L1_ICON}}" x="575" y="242" width="28" height="28" fill="#FFFFFF"/>
  <text x="181" y="248" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">{{L1_LABEL}}</text>
  <text x="1135" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L1_D1}}</text>
  <text x="1135" y="259" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L1_D2}}</text>
  <circle cx="589" cy="348" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <use data-icon="{{L2_ICON}}" x="575" y="334" width="28" height="28" fill="#FFFFFF"/>
  <text x="181" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">{{L2_LABEL}}</text>
  <text x="1135" y="337" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L2_D1}}</text>
  <text x="1135" y="361" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L2_D2}}</text>
  <circle cx="589" cy="440" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <use data-icon="{{L3_ICON}}" x="575" y="426" width="28" height="28" fill="#FFFFFF"/>
  <text x="181" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">{{L3_LABEL}}</text>
  <text x="1135" y="437" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L3_D1}}</text>
  <text x="1135" y="461" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L3_D2}}</text>
  <circle cx="589" cy="533" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <use data-icon="{{L4_ICON}}" x="575" y="519" width="28" height="28" fill="#FFFFFF"/>
  <text x="181" y="544" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">{{L4_LABEL}}</text>
  <text x="1135" y="531" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L4_D1}}</text>
  <text x="1135" y="555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="end" fill="#2C3E50">{{L4_D2}}</text>
  <text x="643" y="664" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#005587">{{CONCLUSION}}</text>
  </g>
  <text x="1180" y="676" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
