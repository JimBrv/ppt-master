<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- McKinsey content layout: spectrum_position. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005587"/>
      <stop offset="100%" stop-color="#0076A8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#headerGrad)"/>
  <rect x="0" y="5" width="1280" height="75" fill="#FAFBFC"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="22" width="6" height="40" fill="#005587"/>
  <text x="84" y="52" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">{{PAGE_TITLE}}</text>
  <rect x="0" y="640" width="1280" height="80" fill="#FAFBFC"/>
  <line x1="0" y1="640" x2="1280" y2="640" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="1140" y="655" width="80" height="30" fill="#005587" rx="4"/>
  <g transform="translate(38.96,-30.09) scale(0.9391)">
  <rect x="100" y="300" width="1080" height="6" rx="3" fill="#E5E7EB"/>
  <!-- extreme L -->
  <text x="60" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#7F8C8D">{{L_NAME}}</text>
  <text x="60" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#7F8C8D">{{L_L1}}</text>
  <text x="60" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#7F8C8D">{{L_L2}}</text>
  <circle cx="140" cy="303" r="14" fill="#7F8C8D"/>
  <rect x="60" y="330" width="170" height="36" rx="18" fill="#7F8C8D" fill-opacity="0.15"/>
  <text x="145" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7F8C8D">{{L_TAG}}</text>
  <!-- extreme R -->
  <text x="880" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#7F8C8D">{{R_NAME}}</text>
  <text x="880" y="246" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#7F8C8D">{{R_L1}}</text>
  <text x="880" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#7F8C8D">{{R_L2}}</text>
  <circle cx="1140" cy="303" r="14" fill="#7F8C8D"/>
  <rect x="880" y="330" width="170" height="36" rx="18" fill="#7F8C8D" fill-opacity="0.15"/>
  <text x="965" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7F8C8D">{{R_TAG}}</text>
  <!-- the position held -->
  <rect x="430" y="150" width="420" height="130" rx="16" fill="#005587"/>
  <text x="640" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{M_NAME}}</text>
  <text x="640" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF">{{M_L1}}</text>
  <text x="640" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF">{{M_L2}}</text>
  <polygon points="622,280 658,280 640,296" fill="#005587"/>
  <circle cx="640" cy="303" r="22" fill="#005587" fill-opacity="0.25"/>
  <circle cx="640" cy="303" r="13" fill="#005587"/>
  <text x="40" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0076A8">{{PRINCIPLES_LABEL}}</text>
  <rect data-slot-box="P1_TITLE" x="40" y="430" width="384" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E5E7EB" stroke-width="1"/>
  <rect data-slot-box="P1_TITLE" x="64" y="450" width="40" height="6" rx="3" fill="#005587"/>
  <text x="64" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#004B77">{{P1_TITLE}}</text>
  <text x="64" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P1_L1}}</text>
  <text x="64" y="549" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P1_L2}}</text>
  <text x="64" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P1_L3}}</text>
  <rect data-slot-box="P2_TITLE" x="448" y="430" width="384" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E5E7EB" stroke-width="1"/>
  <rect data-slot-box="P2_TITLE" x="472" y="450" width="40" height="6" rx="3" fill="#005587"/>
  <text x="472" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#004B77">{{P2_TITLE}}</text>
  <text x="472" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P2_L1}}</text>
  <text x="472" y="549" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P2_L2}}</text>
  <text x="472" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P2_L3}}</text>
  <rect data-slot-box="P3_TITLE" x="856" y="430" width="384" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E5E7EB" stroke-width="1"/>
  <rect data-slot-box="P3_TITLE" x="880" y="450" width="40" height="6" rx="3" fill="#005587"/>
  <text x="880" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#004B77">{{P3_TITLE}}</text>
  <text x="880" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P3_L1}}</text>
  <text x="880" y="549" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P3_L2}}</text>
  <text x="880" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5D6D7E">{{P3_L3}}</text>
  <text x="640" y="660" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#005587">{{CONCLUSION}}</text>
  </g>
  <text x="1180" y="676" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
