<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- McKinsey content layout: probe_tier_channels. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005587"/>
      <stop offset="100%" stop-color="#0076A8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#headerGrad)"/>
  <rect x="0" y="5" width="1280" height="75" fill="#FAFBFC"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="60" y="22" width="6" height="40" fill="#005587"/>
  <text x="84" y="52" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">{{PAGE_TITLE}}</text>
  <rect x="0" y="640" width="1280" height="80" fill="#FAFBFC"/>
  <line x1="0" y1="640" x2="1280" y2="640" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="1140" y="655" width="80" height="30" fill="#005587" rx="4"/>
  <g transform="translate(38.96,-30.09) scale(0.9391)">
  <path d="M0,179 L350,179 C465,179 553,272 553,386 C553,500 465,593 350,593 L0,593 Z" fill="#005587" fill-opacity="0.08"/>
  <path d="M0,231 L303,231 C398,231 474,300 474,386 C474,472 398,541 303,541 L0,541 Z" fill="#005587"/>
  <text x="29" y="326" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">{{HUB_TITLE}}</text>
  <text x="30" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">{{HUB_L1}}</text>
  <text x="30" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">{{HUB_L2}}</text>
  <path d="M28,397 L395,397" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <circle cx="66" cy="451" r="38" fill="#FFFFFF"/>
  <use data-icon="{{HUB_ICON}}" x="50" y="435" width="32" height="32" fill="#005587"/>
  <text x="118" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{HUB_TAG_L1}}</text>
  <text x="118" y="472" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{HUB_TAG_L2}}</text>
  <!-- channel TOP -->
  <circle cx="505" cy="218" r="47" fill="#FFFFFF"/>
  <circle cx="505" cy="218" r="47" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="{{TOP_ICON}}" x="487" y="200" width="36" height="36" fill="#005587"/>
  <rect x="587" y="181" width="103" height="40" rx="10" fill="#005587"/>
  <text x="638" y="209" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{TOP_PILL}}</text>
  <text x="700" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2C3E50">{{TOP_NAME}}</text>
  <text x="960" y="208" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#005587">{{TOP_HINT}}</text>
  <text x="587" y="253" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C3E50">{{TOP_L1}}</text>
  <text x="587" y="281" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C3E50">{{TOP_L2}}</text>
  <text x="1213" y="203" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#005587">{{TOP_NOTE_L1}}</text>
  <text x="1213" y="227" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#005587">{{TOP_NOTE_L2}}</text>
  <!-- channel MID -->
  <circle cx="570" cy="390" r="47" fill="#FFFFFF"/>
  <circle cx="570" cy="390" r="47" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="{{MID_ICON}}" x="552" y="372" width="36" height="36" fill="#005587"/>
  <rect x="652" y="352" width="103" height="40" rx="10" fill="#0076A8"/>
  <text x="703" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{MID_PILL}}</text>
  <text x="765" y="381" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2C3E50">{{MID_NAME}}</text>
  <text x="975" y="379" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#0076A8">{{MID_HINT}}</text>
  <text x="652" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C3E50">{{MID_L1}}</text>
  <text x="652" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C3E50">{{MID_L2}}</text>
  <text x="1213" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0076A8">{{MID_NOTE_L1}}</text>
  <text x="1213" y="398" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0076A8">{{MID_NOTE_L2}}</text>
  <!-- channel BOT -->
  <circle cx="505" cy="561" r="47" fill="#FFFFFF"/>
  <circle cx="505" cy="561" r="47" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <use data-icon="{{BOT_ICON}}" x="487" y="543" width="36" height="36" fill="#005587"/>
  <rect x="587" y="524" width="103" height="40" rx="10" fill="#27AE60"/>
  <text x="638" y="552" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{BOT_PILL}}</text>
  <text x="700" y="553" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2C3E50">{{BOT_NAME}}</text>
  <text x="960" y="551" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#27AE60">{{BOT_HINT}}</text>
  <text x="587" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C3E50">{{BOT_L1}}</text>
  <text x="587" y="624" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C3E50">{{BOT_L2}}</text>
  <text x="1213" y="546" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#27AE60">{{BOT_NOTE_L1}}</text>
  <text x="1213" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#27AE60">{{BOT_NOTE_L2}}</text>
  <text x="636" y="680" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#005587">{{CONCLUSION}}</text>
  </g>
  <text x="1180" y="676" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
