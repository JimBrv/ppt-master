  <rect x="128" y="462" width="1052" height="2" rx="1" fill="#D4E5FC"/>
  <text x="128" y="518" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#333333">{{SUPPORT_L1}}</text>
  <text x="128" y="550" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#333333">{{SUPPORT_L2}}</text>
  <rect data-slot-box="TAG1" x="128" y="596" width="330" height="58" rx="12" fill="#2C7FEF" fill-opacity="0.1"/>
  <text x="293" y="633" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1E6BEE">{{TAG1}}</text>
  <rect data-slot-box="TAG2" x="498" y="596" width="330" height="58" rx="12" fill="#2C7FEF" fill-opacity="0.1"/>
  <text x="663" y="633" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1E6BEE">{{TAG2}}</text>
  <rect data-slot-box="TAG3" x="868" y="596" width="330" height="58" rx="12" fill="#2C7FEF" fill-opacity="0.1"/>
