  <text x="1076" y="393" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" text-anchor="middle" fill="#0F1423">{{N3_L1}}</text>
  <text x="1076" y="419" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" text-anchor="middle" fill="#0F1423">{{N3_L2}}</text>
  <!-- node 4 -->
  <circle cx="867" cy="493" r="47" fill="#4991F1"/>
