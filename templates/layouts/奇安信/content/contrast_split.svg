  <text x="64" y="296" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#64748B">{{L1_NOTE}}</text>
  <rect data-slot-box="R1_TITLE" x="624" y="262" width="32" height="24" rx="12" fill="#2C7FEF" fill-opacity="0.25"/>
  <rect data-slot-box="R1_TITLE" x="670" y="234" width="570" height="80" rx="10" fill="#2C7FEF" fill-opacity="0.08" stroke="#D4E5FC" stroke-width="1"/>
