<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- QAX content layout: contrast_split. Fill every slot; see layouts.json for capacity. -->
  <image href="../images/qax_bg_content.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>
  <text x="58" y="88" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#003893">{{PAGE_TITLE}}</text>
  <rect x="40" y="150" width="570" height="64" rx="12" fill="#64748B"/>
  <text x="325" y="192" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{L_HEAD}}</text>
  <rect x="670" y="150" width="570" height="64" rx="12" fill="#2C7FEF"/>
  <text x="955" y="192" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{R_HEAD}}</text>
  <circle cx="640" cy="182" r="28" fill="#FFFFFF"/>
