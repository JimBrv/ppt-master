  <rect x="40" y="612" width="1200" height="64" rx="12" fill="#2C7FEF"/>
  <text x="640" y="653" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{VERDICT}}</text>
  <text x="1240" y="712" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" text-anchor="end" fill="#9CAEC3">{{PAGE_NUM}}</text>
