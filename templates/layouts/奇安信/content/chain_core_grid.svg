<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- QAX content layout: chain_core_grid. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <linearGradient id="qaxCore" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4874CB"/><stop offset="100%" stop-color="#1773ED"/></linearGradient>
  </defs>
  <image href="../images/qax_bg_content.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>
  <text x="58" y="88" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#003893">{{PAGE_TITLE}}</text>
  <!-- racetrack ring behind the core band -->
  <rect x="205" y="312" width="845" height="202" rx="101" fill="none" stroke="#1773ED" stroke-width="20" stroke-opacity="0.3"/>
  <!-- chain 1 -->
  <text x="201" y="258" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1773ED">{{CH1_TITLE}}</text>
  <text x="201" y="294" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#0F1423">{{CH1_BODY}}</text>
  <!-- chain 2 -->
  <text x="419" y="216" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1773ED">{{CH2_TITLE}}</text>
  <text x="419" y="252" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#0F1423">{{CH2_BODY}}</text>
  <!-- chain 3 -->
  <text x="636" y="216" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1773ED">{{CH3_TITLE}}</text>
  <text x="636" y="252" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#0F1423">{{CH3_BODY}}</text>
  <!-- chain 4 -->
  <text x="854" y="216" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1773ED">{{CH4_TITLE}}</text>
  <text x="854" y="252" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#0F1423">{{CH4_BODY}}</text>
  <!-- chain 5 -->
  <text x="1072" y="258" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#1773ED">{{CH5_TITLE}}</text>
  <text x="1072" y="294" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#0F1423">{{CH5_BODY}}</text>
  <rect x="247" y="342" width="761" height="142" rx="24" fill="#FFFFFF"/>
  <rect x="278" y="363" width="100" height="100" rx="30" fill="url(#qaxCore)"/>
  <text x="328" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE1}}</text>
  <rect x="404" y="363" width="100" height="100" rx="30" fill="url(#qaxCore)"/>
  <text x="454" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE2}}</text>
  <rect x="751" y="363" width="100" height="100" rx="30" fill="url(#qaxCore)"/>
  <text x="801" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE3}}</text>
  <rect x="877" y="363" width="100" height="100" rx="30" fill="url(#qaxCore)"/>
  <text x="927" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{CORE4}}</text>
  <text x="627" y="424" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1773ED">{{CENTER}}</text>
  <rect x="157" y="567" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#6C9CE5" stroke-width="1.5"/>
  <text x="173" y="596" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#4874CB">{{G1_LABEL}}</text>
  <text x="605" y="596" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#0F1423">{{G1_VALUE}}</text>
  <rect x="663" y="567" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#6C9CE5" stroke-width="1.5"/>
  <text x="679" y="596" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#4874CB">{{G2_LABEL}}</text>
  <text x="1111" y="596" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#0F1423">{{G2_VALUE}}</text>
  <rect x="157" y="625" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#6C9CE5" stroke-width="1.5"/>
  <text x="173" y="654" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#4874CB">{{G3_LABEL}}</text>
  <text x="605" y="654" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#0F1423">{{G3_VALUE}}</text>
  <rect x="663" y="625" width="464" height="46" rx="12" fill="#FFFFFF" stroke="#6C9CE5" stroke-width="1.5"/>
  <text x="679" y="654" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#4874CB">{{G4_LABEL}}</text>
  <text x="1111" y="654" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#0F1423">{{G4_VALUE}}</text>
  <text x="1240" y="712" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" text-anchor="end" fill="#9CAEC3">{{PAGE_NUM}}</text>
