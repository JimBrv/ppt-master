<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- QAX content layout: matrix_2x2. Fill every slot; see layouts.json for capacity. -->
  <image href="../images/qax_bg_content.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>
  <text x="58" y="88" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#003893">{{PAGE_TITLE}}</text>
  <rect x="140" y="156" width="4" height="438" rx="2" fill="#64748B"/>
  <polygon points="130,160 142,138 154,160" fill="#64748B"/>
  <rect x="170" y="600" width="1046" height="4" rx="2" fill="#64748B"/>
  <polygon points="1214,590 1236,602 1214,614" fill="#64748B"/>
  <text x="126" y="180" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#64748B">{{Y_HIGH}}</text>
  <text x="126" y="380" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#4874CB">{{Y_LABEL}}</text>
  <text x="126" y="584" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#64748B">{{Y_LOW}}</text>
  <text x="170" y="634" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#64748B">{{X_LOW}}</text>
  <text x="693" y="634" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4874CB">{{X_LABEL}}</text>
  <text x="1216" y="634" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" text-anchor="end" fill="#64748B">{{X_HIGH}}</text>
  <!-- quadrant TL -->
  <rect x="170" y="150" width="525" height="210" rx="14" fill="#F4F7FB" stroke="#D4E5FC" stroke-width="1"/>
  <text x="198" y="206" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#1E6BEE">{{TL_TITLE}}</text>
  <text x="198" y="250" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{TL_L1}}</text>
  <text x="198" y="278" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{TL_L2}}</text>
  <text x="198" y="306" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{TL_L3}}</text>
  <!-- quadrant TR -->
  <rect x="715" y="150" width="525" height="210" rx="14" fill="#2C7FEF"/>
  <text x="743" y="206" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{TR_TITLE}}</text>
  <text x="743" y="250" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#FFFFFF">{{TR_L1}}</text>
  <text x="743" y="278" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#FFFFFF">{{TR_L2}}</text>
  <text x="743" y="306" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#FFFFFF">{{TR_L3}}</text>
  <!-- quadrant BL -->
  <rect x="170" y="380" width="525" height="210" rx="14" fill="#F4F7FB" stroke="#D4E5FC" stroke-width="1"/>
  <text x="198" y="436" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#1E6BEE">{{BL_TITLE}}</text>
  <text x="198" y="480" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{BL_L1}}</text>
  <text x="198" y="508" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{BL_L2}}</text>
  <text x="198" y="536" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{BL_L3}}</text>
  <!-- quadrant BR -->
  <rect x="715" y="380" width="525" height="210" rx="14" fill="#F4F7FB" stroke="#D4E5FC" stroke-width="1"/>
  <text x="743" y="436" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#1E6BEE">{{BR_TITLE}}</text>
  <text x="743" y="480" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{BR_L1}}</text>
  <text x="743" y="508" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{BR_L2}}</text>
  <text x="743" y="536" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{BR_L3}}</text>
  <text x="640" y="682" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#3182EF">{{CONCLUSION}}</text>
  <text x="1240" y="712" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" text-anchor="end" fill="#9CAEC3">{{PAGE_NUM}}</text>
</svg>
