<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- QAX content layout: spectrum_position. Fill every slot; see layouts.json for capacity. -->
  <image href="../images/qax_bg_content.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>
  <text x="58" y="88" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#003893">{{PAGE_TITLE}}</text>
  <rect x="100" y="300" width="1080" height="6" rx="3" fill="#D4E5FC"/>
  <!-- extreme L -->
  <text x="60" y="214" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" fill="#64748B">{{L_NAME}}</text>
  <text x="60" y="246" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#64748B">{{L_L1}}</text>
  <text x="60" y="270" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#64748B">{{L_L2}}</text>
  <circle cx="140" cy="303" r="14" fill="#64748B"/>
  <rect x="60" y="330" width="170" height="36" rx="18" fill="#64748B" fill-opacity="0.15"/>
  <text x="145" y="354" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#64748B">{{L_TAG}}</text>
  <!-- extreme R -->
  <text x="880" y="214" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" fill="#64748B">{{R_NAME}}</text>
  <text x="880" y="246" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#64748B">{{R_L1}}</text>
  <text x="880" y="270" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#64748B">{{R_L2}}</text>
  <circle cx="1140" cy="303" r="14" fill="#64748B"/>
  <rect x="880" y="330" width="170" height="36" rx="18" fill="#64748B" fill-opacity="0.15"/>
  <text x="965" y="354" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#64748B">{{R_TAG}}</text>
  <!-- the position held -->
  <rect x="430" y="150" width="420" height="130" rx="16" fill="#2C7FEF"/>
  <text x="640" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{M_NAME}}</text>
  <text x="640" y="232" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF">{{M_L1}}</text>
  <text x="640" y="256" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF">{{M_L2}}</text>
  <polygon points="622,280 658,280 640,296" fill="#2C7FEF"/>
  <circle cx="640" cy="303" r="22" fill="#2C7FEF" fill-opacity="0.25"/>
  <circle cx="640" cy="303" r="13" fill="#2C7FEF"/>
  <text x="40" y="414" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold" fill="#4874CB">{{PRINCIPLES_LABEL}}</text>
  <rect data-slot-box="P1_TITLE" x="40" y="430" width="384" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#D4E5FC" stroke-width="1"/>
  <rect data-slot-box="P1_TITLE" x="64" y="450" width="40" height="6" rx="3" fill="#2C7FEF"/>
  <text x="64" y="492" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#1E6BEE">{{P1_TITLE}}</text>
  <text x="64" y="522" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P1_L1}}</text>
  <text x="64" y="549" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P1_L2}}</text>
  <text x="64" y="576" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P1_L3}}</text>
  <rect data-slot-box="P2_TITLE" x="448" y="430" width="384" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#D4E5FC" stroke-width="1"/>
  <rect data-slot-box="P2_TITLE" x="472" y="450" width="40" height="6" rx="3" fill="#2C7FEF"/>
  <text x="472" y="492" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#1E6BEE">{{P2_TITLE}}</text>
  <text x="472" y="522" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P2_L1}}</text>
  <text x="472" y="549" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P2_L2}}</text>
  <text x="472" y="576" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P2_L3}}</text>
  <rect data-slot-box="P3_TITLE" x="856" y="430" width="384" height="180" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#D4E5FC" stroke-width="1"/>
  <rect data-slot-box="P3_TITLE" x="880" y="450" width="40" height="6" rx="3" fill="#2C7FEF"/>
  <text x="880" y="492" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#1E6BEE">{{P3_TITLE}}</text>
  <text x="880" y="522" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P3_L1}}</text>
  <text x="880" y="549" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P3_L2}}</text>
  <text x="880" y="576" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{P3_L3}}</text>
  <text x="640" y="660" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#3182EF">{{CONCLUSION}}</text>
  <text x="1240" y="712" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" text-anchor="end" fill="#9CAEC3">{{PAGE_NUM}}</text>
</svg>
