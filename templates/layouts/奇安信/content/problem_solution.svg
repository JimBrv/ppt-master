<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- QAX content layout: problem_solution. Fill every slot; see layouts.json for capacity. -->
  <image href="../images/qax_bg_content.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>
  <text x="58" y="88" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#003893">{{PAGE_TITLE}}</text>
  <rect data-slot-box="SERIES" x="40" y="146" width="150" height="40" rx="20" fill="#2C7FEF"/>
  <text x="115" y="173" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">{{SERIES}}</text>
  <text x="210" y="174" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-style="italic" fill="#4874CB">{{HOOK}}</text>
  <!-- problem panel -->
  <rect x="40" y="206" width="560" height="404" rx="16" fill="#F4F7FB" stroke="#D4E5FC" stroke-width="1"/>
  <text x="72" y="248" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" fill="#64748B">{{PROBLEM_LABEL}}</text>
  <text x="72" y="294" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#0F1423">{{PROBLEM_TITLE}}</text>
  <text x="72" y="332" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{PROBLEM_L1}}</text>
  <text x="72" y="358" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#333333">{{PROBLEM_L2}}</text>
  <rect x="72" y="382" width="496" height="1.5" fill="#D4E5FC"/>
  <text x="72" y="416" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold" fill="#4874CB">{{WHY_LABEL}}</text>
  <rect data-slot-box="WHY1" x="74" y="446" width="9" height="9" rx="2" fill="#2C7FEF"/>
  <text x="96" y="458" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#0F1423">{{WHY1}}</text>
  <rect data-slot-box="WHY2" x="74" y="496" width="9" height="9" rx="2" fill="#2C7FEF"/>
  <text x="96" y="508" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#0F1423">{{WHY2}}</text>
  <rect data-slot-box="WHY3" x="74" y="546" width="9" height="9" rx="2" fill="#2C7FEF"/>
  <text x="96" y="558" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" fill="#0F1423">{{WHY3}}</text>
  <polygon points="608,390 630,390 630,374 654,410 630,446 630,430 608,430" fill="#2C7FEF"/>
  <!-- responses -->
  <text x="668" y="236" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" fill="#1E6BEE">{{RESPONSE_LABEL}}</text>
  <rect data-slot-box="R1_ACTION" x="668" y="256" width="572" height="106" rx="12" fill="#FFFFFF" stroke="#D4E5FC" stroke-width="1"/>
  <rect data-slot-box="R1_ACTION" x="688" y="274" width="124" height="34" rx="17" fill="#1E6BEE" fill-opacity="0.15"/>
  <text x="750" y="297" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E6BEE">{{R1_ACTOR}}</text>
  <text x="830" y="298" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" fill="#0F1423">{{R1_ACTION}}</text>
  <text x="688" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{R1_L1}}</text>
  <rect data-slot-box="R2_ACTION" x="668" y="374" width="572" height="106" rx="12" fill="#FFFFFF" stroke="#D4E5FC" stroke-width="1"/>
  <rect data-slot-box="R2_ACTION" x="688" y="392" width="124" height="34" rx="17" fill="#28A963" fill-opacity="0.15"/>
  <text x="750" y="415" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#28A963">{{R2_ACTOR}}</text>
  <text x="830" y="416" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" fill="#0F1423">{{R2_ACTION}}</text>
  <text x="688" y="458" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{R2_L1}}</text>
  <rect data-slot-box="R3_ACTION" x="668" y="492" width="572" height="106" rx="12" fill="#FFFFFF" stroke="#D4E5FC" stroke-width="1"/>
  <rect data-slot-box="R3_ACTION" x="688" y="510" width="124" height="34" rx="17" fill="#42AFF0" fill-opacity="0.15"/>
  <text x="750" y="533" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#42AFF0">{{R3_ACTOR}}</text>
  <text x="830" y="534" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="bold" fill="#0F1423">{{R3_ACTION}}</text>
  <text x="688" y="576" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#333333">{{R3_L1}}</text>
  <rect x="40" y="628" width="1200" height="56" rx="12" fill="#2C7FEF" fill-opacity="0.1"/>
  <text x="640" y="664" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#3182EF">{{CONCLUSION}}</text>
  <text x="1240" y="712" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" text-anchor="end" fill="#9CAEC3">{{PAGE_NUM}}</text>
</svg>
