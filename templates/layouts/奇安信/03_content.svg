<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <!-- Background: content page from original PPTX (image4.jpeg) -->
  <image href="../images/qax_bg_content.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <!-- Original HD Logo Overlay (image1.png) -->
  <image href="../images/qax_logo.png" x="992.3" y="0" width="275.2" height="110.4" preserveAspectRatio="none"/>

  
  <!-- Page title placeholder -->
  <text x="50" y="62" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1D4F9F">{{PAGE_TITLE}}</text>
  
  <!-- Subtitle / summary line -->
  <text x="50" y="110" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#333333">{{SUMMARY}}</text>
  
  <!-- Key Insight Bar (Moved up below summary to match McKinsey structure, adapted to QAX style) -->
  <!-- QAX Style Insight Bar -->
  <rect x="50" y="140" width="1180" height="50" rx="4" fill="#E5F2FC" fill-opacity="0.9"/>
  <rect x="50" y="140" width="4" height="50" rx="2" fill="#0884E2"/>
  <text x="75" y="172" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#0884E2">💡 KEY INSIGHT</text>
  <text x="210" y="172" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold" fill="#1E272E">{{INSIGHT}}</text>

  <!-- Content area marker with visible bounds like McKinsey -->
  <!-- 
    AI Flexible Layout Area
    Available Space: x=50, y=210, width=1180, height=450
  -->
  <!-- CONTENT_AREA_START -->
  <rect x="50" y="210" width="1180" height="450" fill="none" stroke="#BDC3C7" stroke-width="1.5" stroke-dasharray="8,6" rx="4"/>
  <text x="640" y="425" text-anchor="middle" fill="#BDC3C7" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20">
    {{CONTENT_AREA}}
  </text>
  <text x="640" y="460" text-anchor="middle" fill="#D5DBDB" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">
    Content Area: 1180 × 450 px
  </text>
  <!-- CONTENT_AREA_END -->

  <!-- Source Note (Bottom Left) -->
  <text x="50" y="695" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#95A5A6">Source: {{SOURCE}}</text>
  
  <!-- Page Number (Bottom Right) -->
  <text x="1230" y="695" text-anchor="end" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#636E72">{{PAGE_NUM}}</text>

  </svg>