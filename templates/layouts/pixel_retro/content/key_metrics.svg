  <text x="76" y="478" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{M1_L2}}</text>
  <text x="76" y="506" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#C9D1D9">{{M1_L3}}</text>
