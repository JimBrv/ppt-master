<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Pixel Retro content layout: hero_statement. Fill every slot; see layouts.json for capacity. -->
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect x="0" y="0" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <text x="60" y="70" font-family="Consolas, Microsoft YaHei, monospace" font-size="36" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">{{PAGE_TITLE}}</text>
  <rect x="60" y="100" width="200" height="2" fill="#30363D"/>
  <rect x="0" y="716" width="1280" height="4" fill="#39FF14" fill-opacity="0.6"/>
  <g transform="translate(10.02,-15.97) scale(0.9843)">
  <circle cx="1110" cy="300" r="150" fill="#123945" fill-opacity="0.45"/>
  <circle cx="1110" cy="300" r="96" fill="#123945" fill-opacity="0.6"/>
  <text x="128" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#1F6FEB">{{KICKER}}</text>
  <rect x="96" y="236" width="8" height="180" rx="4" fill="#00D4FF"/>
  <text x="128" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="46" font-weight="bold" fill="#E6EDF3">{{STATEMENT_L1}}</text>
  <text x="128" y="368" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="46" font-weight="bold" fill="#E6EDF3">{{STATEMENT_L2}}</text>
  <text x="128" y="418" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#8B949E">{{ATTRIBUTION}}</text>
  <rect x="128" y="462" width="1052" height="2" rx="1" fill="#30363D"/>
  <text x="128" y="518" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#C9D1D9">{{SUPPORT_L1}}</text>
  <text x="128" y="550" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#C9D1D9">{{SUPPORT_L2}}</text>
  <rect data-slot-box="TAG1" x="128" y="596" width="330" height="58" rx="12" fill="#00D4FF" fill-opacity="0.1"/>
  <text x="293" y="633" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1FD9FF">{{TAG1}}</text>
  <rect data-slot-box="TAG2" x="498" y="596" width="330" height="58" rx="12" fill="#00D4FF" fill-opacity="0.1"/>
  <text x="663" y="633" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1FD9FF">{{TAG2}}</text>
  <rect data-slot-box="TAG3" x="868" y="596" width="330" height="58" rx="12" fill="#00D4FF" fill-opacity="0.1"/>
  <text x="1033" y="633" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1FD9FF">{{TAG3}}</text>
  </g>
  <text x="60" y="698" font-family="Consolas, monospace" font-size="14" fill="#8B949E">{{PAGE_NUM}}</text>
</svg>
