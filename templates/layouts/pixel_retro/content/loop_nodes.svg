  <text x="422" y="612" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N5_L1}}</text>
  <text x="422" y="638" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N5_L2}}</text>
  </g>
  <text x="60" y="698" font-family="Consolas, monospace" font-size="14" fill="#8B949E">{{PAGE_NUM}}</text>
</svg>
