  <text x="639" y="348" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N2_L1}}</text>
  <text x="639" y="374" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N2_L2}}</text>
  <!-- node 3 -->
  <circle cx="1076" cy="275" r="47" fill="#04AFD3"/>
  <use data-icon="{{N3_ICON}}" x="1054" y="253" width="44" height="44" fill="#0D1117"/>
  <text x="1076" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#39FF14">{{N3_TITLE}}</text>
  <text x="1076" y="393" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N3_L1}}</text>
  <text x="1076" y="419" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N3_L2}}</text>
  <!-- node 4 -->
  <circle cx="867" cy="493" r="47" fill="#04AFD3"/>
  <use data-icon="{{N4_ICON}}" x="845" y="471" width="44" height="44" fill="#0D1117"/>
  <text x="867" y="579" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#39FF14">{{N4_TITLE}}</text>
  <text x="867" y="611" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N4_L1}}</text>
  <text x="867" y="637" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" text-anchor="middle" fill="#E6EDF3">{{N4_L2}}</text>
  <!-- node 5 -->
  <circle cx="422" cy="494" r="47" fill="#04AFD3"/>
  <use data-icon="{{N5_ICON}}" x="400" y="472" width="44" height="44" fill="#0D1117"/>
